<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- waveform (audio in) -->
  <g fill="#C7D2FE">
    <rect x="150" y="452" width="34" height="120" rx="17"/>
    <rect x="212" y="392" width="34" height="240" rx="17"/>
    <rect x="274" y="332" width="34" height="360" rx="17"/>
    <rect x="336" y="422" width="34" height="180" rx="17"/>
  </g>

  <!-- microphone (center) -->
  <g>
    <rect x="452" y="242" width="150" height="280" rx="75" fill="#FFFFFF"/>
    <path d="M 392 462 a 135 135 0 0 0 270 0" fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <line x1="527" y1="600" x2="527" y2="682" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <line x1="447" y1="700" x2="607" y2="700" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
  </g>

  <!-- text lines (transcript out) -->
  <g fill="#FFFFFF">
    <rect x="686" y="368" width="196" height="38" rx="19" opacity="0.95"/>
    <rect x="686" y="446" width="146" height="38" rx="19" opacity="0.8"/>
    <rect x="686" y="524" width="176" height="38" rx="19" opacity="0.65"/>
    <rect x="686" y="602" width="112" height="38" rx="19" opacity="0.5"/>
  </g>
</svg>
